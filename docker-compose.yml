name: ${APP_SLUG:-app}

services:
  traefik:
    image: traefik:v3.6
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app_net

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=${APP_SLUG:-app}_net
      - traefik.http.routers.${APP_SLUG:-app}-web.rule=Host(`${APP_SLUG:-app}.localhost`)
      - traefik.http.routers.${APP_SLUG:-app}-web.entrypoints=web
      - traefik.http.routers.${APP_SLUG:-app}-web.service=${APP_SLUG:-app}-app
      - traefik.http.routers.${APP_SLUG:-app}-api.rule=Host(`api.${APP_SLUG:-app}.localhost`)
      - traefik.http.routers.${APP_SLUG:-app}-api.entrypoints=web
      - traefik.http.routers.${APP_SLUG:-app}-api.service=${APP_SLUG:-app}-app
      - traefik.http.services.${APP_SLUG:-app}-app.loadbalancer.server.port=80
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  adminer:
    image: adminer:4-standalone
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${APP_SLUG:-app}_net
      - traefik.http.routers.${APP_SLUG:-app}-pma.rule=Host(`db.${APP_SLUG:-app}.localhost`)
      - traefik.http.routers.${APP_SLUG:-app}-pma.entrypoints=web
      - traefik.http.services.${APP_SLUG:-app}-pma.loadbalancer.server.port=8080
    networks:
      - app_net

  mailhog:
    image: mailhog/mailhog:latest
    labels:
      - traefik.enable=true
      - traefik.docker.network=${APP_SLUG:-app}_net
      - traefik.http.routers.${APP_SLUG:-app}-mail.rule=Host(`mail.${APP_SLUG:-app}.localhost`)
      - traefik.http.routers.${APP_SLUG:-app}-mail.entrypoints=web
      - traefik.http.services.${APP_SLUG:-app}-mail.loadbalancer.server.port=8025
    networks:
      - app_net

volumes:
  postgres_data:
  node_modules:

networks:
  app_net:
    name: ${APP_SLUG:-app}_net
